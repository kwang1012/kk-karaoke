# Start everything with:  docker compose up --build   (then open http://localhost:8080)
# Needs backend/.env (copy backend/.env.example; no credentials are required to start).
x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    STORAGE_DIR: /app/storage
    DATA_DIR: /app/data
  volumes:
    - ./backend/storage:/app/storage
    - ./backend/data:/app/data
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORAGE_DIR: /app/storage
      DATA_DIR: /app/data
      # demucs downloads its weights on first use; keep them across container rebuilds.
      # (Own path, not /root/.cache: that already has content in the image, and two
      # containers initialising one volume from it race.)
      TORCH_HOME: /models
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/data:/app/data
      - model-cache:/models
    # One job at a time by default: separation on this machine is memory- and GPU-hungry. With
    # USE_MODAL the GPU work happens on Modal, so set WORKER_CONCURRENCY=3 (or more) in backend/.env to process
    # several songs at once; a fallback to local Demucs still takes turns.
    # `-Q urgent,celery`: the song being sung is taken before the ones waiting.
    command: ["sh", "-c", "exec celery -A services.process_request.celery worker -l info -Q urgent,celery --pool=threads --concurrency=$${WORKER_CONCURRENCY:-1}"]

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  model-cache:
