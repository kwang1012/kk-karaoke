server {
    listen 8080;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    # Re-resolve `api` through Docker's DNS (the variable forces a lookup per request, honouring
    # `valid`). With a plain proxy_pass nginx resolves it once at startup, so recreating or
    # restarting the api container (new IP) made every /api call return 502 until nginx restarted.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep idle WebSockets open (nginx default is 60s)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
