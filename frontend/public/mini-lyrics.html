<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KKaraoke</title>
    <!-- The floating lyrics window of the desktop app (electron.js). Plain HTML on purpose: the main window owns
         the player and sends this one the current line, so it needs none of the app. -->
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        display: flex; flex-direction: column; justify-content: center; gap: 6px;
        padding: 14px 20px 10px; color: #fff; text-align: center; user-select: none;
        font-family: system-ui, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
        background: linear-gradient(160deg, #3a1230, #16121f);
        -webkit-app-region: drag;
      }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-height: 0; }
      #message { font-size: 15px; opacity: 0.7; }
      #line { font-size: 24px; font-weight: 700; line-height: 1.25; }
      #line.upcoming { opacity: 0.5; }
      .info { flex: 1; min-width: 0; text-align: left; margin: 0 6px; }
      #title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #artist { font-size: 11px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #next { font-size: 15px; opacity: 0.5; line-height: 1.25; min-height: 19px; }
      #line, #next { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .controls { display: flex; align-items: center; gap: 2px; margin-top: 4px; -webkit-app-region: no-drag; }
      button {
        display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0;
        width: 30px; height: 30px; border: 0; border-radius: 50%; color: #fff; cursor: pointer;
        background: transparent; opacity: 0.85;
      }
      button svg { display: block; }
      .pill { width: auto; height: 26px; padding: 0 10px; gap: 5px; border-radius: 13px; font: 600 11px system-ui, 'Segoe UI', sans-serif; white-space: nowrap; background: rgba(255, 255, 255, 0.16); opacity: 1; }
      .pill:hover { background: rgba(255, 255, 255, 0.26); }
      .volume { display: flex; align-items: center; flex: none; gap: 2px; }
      #mute { width: 26px; height: 26px; }
      input[type='range'] {
        -webkit-appearance: none; appearance: none; width: 72px; height: 4px; border-radius: 2px; cursor: pointer;
        background: linear-gradient(to right, #fff var(--fill, 80%), rgba(255, 255, 255, 0.25) var(--fill, 80%));
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 0;
      }
      #toggle { width: 36px; height: 36px; }
      button:hover { background: rgba(255, 255, 255, 0.16); opacity: 1; }
    </style>
  </head>
  <body>
    <main>
      <div id="message"></div>
      <div id="line"></div>
      <div id="next"></div>
    </main>
    <div class="controls">
      <button id="previous" aria-label="Previous song" title="Previous song"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M3 20V4"/></svg></button>
      <button id="toggle" aria-label="Play or pause" title="Play / Pause"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></button>
      <button id="next-song" aria-label="Next song" title="Next song"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg></button>
      <div class="info"><div id="title"></div><div id="artist"></div></div>
      <button id="karaoke" class="pill" title="Toggle original vocal"></button>
      <div class="volume">
        <button id="mute" aria-label="Mute" title="Mute"></button>
        <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume" />
      </div>
      <button id="back" aria-label="Back to the main window" title="Back to the main window"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    </div>
    <script>
      const api = window.kkaraoke;
      const $ = (id) => document.getElementById(id);
      const wrap = (inner) => '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
      const MIC_ICONS = {"on": "<svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 19v3\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><rect x=\"9\" y=\"2\" width=\"6\" height=\"13\" rx=\"3\"/></svg>", "off": "<svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 19v3\"/><path d=\"M15 9.34V5a3 3 0 0 0-5.68-1.33\"/><path d=\"M16.95 16.95A7 7 0 0 1 5 12v-2\"/><path d=\"M18.89 13.23A7 7 0 0 0 19 12v-2\"/><path d=\"m2 2 20 20\"/><path d=\"M9 9v3a3 3 0 0 0 5.12 2.12\"/></svg>"};
      const VOLUME_ICONS = {"x": "<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 4.702a.7.7 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.7.7 0 0 0 11 19.298z\"/><path d=\"m16.5 14.5 5-5\"/><path d=\"m16.5 9.5 5 5\"/></svg>", "low": "<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z\"/><path d=\"M16 9a5 5 0 0 1 0 6\"/></svg>", "high": "<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z\"/><path d=\"M16 9a5 5 0 0 1 0 6\"/><path d=\"M19.364 18.364a9 9 0 0 0 0-12.728\"/></svg>"};
      const ICONS = { play: wrap('<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>'), pause: wrap('<rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/>') };
      if (api) {
        api.onMiniState((s) => {
          $('title').textContent = s.title || 'Nothing playing';
          $('artist').textContent = s.artist || '';
          $('message').textContent = s.message || '';
          $('message').style.display = s.message ? '' : 'none';
          $('line').textContent = s.message ? '' : s.line || '';
          $('line').classList.toggle('upcoming', s.current === false);
          $('next').textContent = s.message ? '' : s.next || '';
          $('toggle').innerHTML = s.playing ? ICONS.pause : ICONS.play;
          if (typeof s.volume === 'number') showVolume(s.volume);
          const vocal = !!s.vocalOn;
          $('karaoke').innerHTML = (vocal ? MIC_ICONS.on : MIC_ICONS.off) + '<span>' + (vocal ? 'Vocal' : 'Karaoke') + '</span>';
        });
        let volume = 0.8;
        let lastAudible = 0.8;
        const showVolume = (value) => {
          volume = value;
          if (value > 0) lastAudible = value;
          const slider = $('volume');
          if (document.activeElement !== slider) slider.value = Math.round(value * 100);
          slider.style.setProperty('--fill', Math.round(value * 100) + '%');
          $('mute').innerHTML = value === 0 ? VOLUME_ICONS.x : value < 0.5 ? VOLUME_ICONS.low : VOLUME_ICONS.high;
          $('mute').title = $('mute').ariaLabel = value === 0 ? 'Unmute' : 'Mute';
        };
        showVolume(volume);
        $('volume').oninput = (e) => {
          const value = Number(e.target.value) / 100;
          showVolume(value);
          api.miniCommand({ type: 'volume', value });
        };
        $('mute').onclick = () => {
          const value = volume === 0 ? lastAudible || 0.8 : 0;
          showVolume(value);
          api.miniCommand({ type: 'volume', value });
        };
        $('karaoke').onclick = () => api.miniCommand({ type: 'karaoke' });
        $('previous').onclick = () => api.mediaKey('previous');
        $('toggle').onclick = () => api.mediaKey('toggle');
        $('next-song').onclick = () => api.mediaKey('next');
        $('back').onclick = () => api.toggleMini();
        api.miniReady();
      }
    </script>
  </body>
</html>
